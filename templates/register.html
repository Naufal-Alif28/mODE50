{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="bg-body-tertiary min-vh-100 d-flex flex-row align-items-center">
      <div id="liveAlertPlaceholder" style="position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); width: min(600px, calc(100% - 2rem)); z-index: 1080;"></div>    
      <div class="container" style="max-width: 32rem">
        <div class="d-flex flex-column gap-4 text-center">
          <div class="card p-4">
            <div class="card-body d-flex flex-column gap-4">
              <h2 class="h5 text-center">Create new account</h2>
              <form class="row gap-3 text-start" action="/register" id="auth-form" method="post" autocomplete="off" novalidate>
                <div>
                  <label class="form-label" for="username">Name</label>
                  <input class="form-control" id="username" name="username" type="text" placeholder="Your name" autocomplete="off" autofocus>
                </div>
                <div>
                  <label class="form-label" for="password">Password</label>
                  <div class="input-group">
                    <input class="form-control" id="password" name="password" type="password" placeholder="Your password" autocomplete="off">
                    <span class="input-group-text">
                      <button class="bg-transparent border-0 p-0 link-secondary" type="button" data-coreui-toggle="tooltip" aria-label="Show password" data-coreui-original-title="Show password">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                          <path class="ci-primary" fill="var(--ci-primary-color, currentcolor)" d="M256 144.927a103.309 103.309 0 1 0 103.309 103.309A103.426 103.426 0 0 0 256 144.927m0 174.618a71.309 71.309 0 1 1 71.309-71.309A71.39 71.39 0 0 1 256 319.545"></path>
                          <path class="ci-primary" fill="var(--ci-primary-color, currentcolor)" d="m397.222 131.1-.218-.223c-77.75-77.749-204.258-77.749-282.008 0L16 233.79v28.893l98.778 102.689.218.222a199.41 199.41 0 0 0 282.008 0l99-102.911V233.79ZM464 249.79l-89.732 93.285a167.41 167.41 0 0 1-236.536 0L48 249.79v-3.107l89.729-93.283c65.247-65.13 171.3-65.13 236.542 0L464 246.683Z"></path>
                          <path class="ci-primary" fill="var(--ci-primary-color, currentcolor)" d="M240 232h32v32h-32z"></path>
                        </svg>
                      </button>
                    </span>
                  </div>
                  <div>
                  <label class="form-label" for="confirmation">Confirm password</label>
                  <div class="input-group">
                    <input class="form-control" id="confirmation" name="confirmation" type="password" placeholder="Re-type your password" autocomplete="off">
                    <span class="input-group-text">
                      <button class="bg-transparent border-0 p-0 link-secondary" type="button" data-coreui-toggle="tooltip" aria-label="Show password" data-coreui-original-title="Show password">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                          <path class="ci-primary" fill="var(--ci-primary-color, currentcolor)" d="M256 144.927a103.309 103.309 0 1 0 103.309 103.309A103.426 103.426 0 0 0 256 144.927m0 174.618a71.309 71.309 0 1 1 71.309-71.309A71.39 71.39 0 0 1 256 319.545"></path>
                          <path class="ci-primary" fill="var(--ci-primary-color, currentcolor)" d="m397.222 131.1-.218-.223c-77.75-77.749-204.258-77.749-282.008 0L16 233.79v28.893l98.778 102.689.218.222a199.41 199.41 0 0 0 282.008 0l99-102.911V233.79ZM464 249.79l-89.732 93.285a167.41 167.41 0 0 1-236.536 0L48 249.79v-3.107l89.729-93.283c65.247-65.13 171.3-65.13 236.542 0L464 246.683Z"></path>
                          <path class="ci-primary" fill="var(--ci-primary-color, currentcolor)" d="M240 232h32v32h-32z"></path>
                        </svg>
                      </button>
                    </span>
                  </div>
                </div>
                <div>
                  <button class="btn btn-primary w-100 mt-5" type="submit">Create new account</button>
                </div>
              </form>
            </div>
          </div>
          <div class="text-body-secondary">
            Already have an account?
            <a href="/login">Sign in</a>
          </div>
        </div>
      </div>
    </div>
    <!-- CoreUI and necessary plugins-->
    <script src="static/vendors/@coreui/coreui/js/coreui.bundle.min.js"></script>
    <script src="static/vendors/simplebar/js/simplebar.min.js"></script>
    <!-- script for alert -->
    <script src="static/js/alert-authentication.js"></script>
    <script>
      const header = document.querySelector("header.header");

      document.addEventListener("scroll", () => {
        if (header) {
          header.classList.toggle("shadow-sm", document.documentElement.scrollTop > 0);
        }
      });
    </script>
{% endblock %}
